StylesPath = styles
MinAlertLevel = warning

Packages = write-good, proselint

[*.md]
BasedOnStyles = write-good, proselint

# The report quotes Generative AI Lens best-practice titles verbatim ("Implement ...", "Monitor ..."). TooWordy flags
# those verbs; rewording them would misquote AWS, so the rule is off for the report only.
[report/*.md]
BasedOnStyles = write-good, proselint
write-good.TooWordy = NO
