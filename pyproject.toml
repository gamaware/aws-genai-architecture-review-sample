[project]
name = "aws-genai-architecture-review-sample"
version = "1.0.0"
description = "Reviews a fictional GenAI workload against the AWS Well-Architected Generative AI Lens, with fixes and a cost model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyyaml==6.0.3"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { ruff = false }
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["scripts", "tests", "fixes/app"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["scripts", "tests", "fixes/app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
