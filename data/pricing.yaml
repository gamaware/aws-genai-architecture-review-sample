# Unit prices used by the cost model: US East (N. Virginia), on-demand list prices in USD.
# Sources: https://aws.amazon.com/bedrock/pricing/, https://aws.amazon.com/opensearch-service/pricing/,
# https://aws.amazon.com/s3/pricing/ (S3 Vectors) and https://aws.amazon.com/cloudwatch/pricing/.
# Prices change; an engagement re-checks every value here against the pricing pages before the report goes out.
currency: USD

# Geographic cross-Region inference profiles (the us., eu. and apac. prefixes) cost more than global profiles for
# Claude Sonnet 4.5, Claude Haiku 4.5 and later Claude models: "Regional and multi-region endpoints include a 10%
# premium over global endpoints" (https://platform.claude.com/docs/en/about-claude/pricing, section "Regional and
# multi-region endpoint pricing"; the geographic rows of https://aws.amazon.com/bedrock/pricing/). The cost model
# multiplies every token price of a model by (1 + geographic_premium) when its model_id carries a geographic prefix.
# Amazon Nova models have no geographic premium.
geographic_prefixes: [us., eu., apac.]

models:
  # Per 1M tokens, global list prices. Cache write and cache read apply to prompt caching.
  # foundation_model: the model ID behind the profile, used to resolve application inference profile ARNs.
  # min_cache_tokens: the smallest prompt prefix a cache checkpoint accepts; a shorter prefix is never cached
  # (https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html, "Supported models, Regions, and
  # explicit caching limits").
  claude-sonnet:
    label: Claude Sonnet 4.5
    model_id: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    foundation_model: anthropic.claude-sonnet-4-5-20250929-v1:0
    geographic_premium: 0.10
    min_cache_tokens: 1024
    input: 3.00
    output: 15.00
    cache_write: 3.75
    cache_read: 0.30
  claude-haiku:
    label: Claude Haiku 4.5
    model_id: us.anthropic.claude-haiku-4-5-20251001-v1:0
    foundation_model: anthropic.claude-haiku-4-5-20251001-v1:0
    geographic_premium: 0.10
    min_cache_tokens: 4096
    input: 1.00
    output: 5.00
    cache_write: 1.25
    cache_read: 0.10
  nova-lite:
    label: Amazon Nova Lite
    model_id: us.amazon.nova-lite-v1:0
    foundation_model: amazon.nova-lite-v1:0
    geographic_premium: 0.0
    min_cache_tokens: 1000
    input: 0.06
    output: 0.24
    cache_write: 0.06
    cache_read: 0.015

# Batch inference is billed at this share of the on-demand token price.
batch_price_factor: 0.50

embeddings:
  label: Amazon Titan Text Embeddings V2
  per_million_tokens: 0.02

guardrails:
  # Per 1,000 text units; one text unit is up to 1,000 characters, charged per policy type that evaluates it.
  content_filter: 0.15
  denied_topics: 0.15
  sensitive_information: 0.10

opensearch_serverless:
  ocu_hour: 0.24

s3_vectors:
  storage_gb_month: 0.06
  query_per_million: 2.50
  query_data_per_tb: 0.004

cloudwatch_logs:
  ingestion_per_gb: 0.50
  storage_gb_month: 0.03
