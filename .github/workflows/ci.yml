name: ci

# Thin caller: shared checks come from gamaware/.github; `make verify` is the same command contributors run locally.
# No job receives cloud credentials or an id-token.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-docs:
    name: lint-docs
    uses: gamaware/.github/.github/workflows/lint-docs.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9 # gamaware/.github initial workflows
    permissions:
      contents: read # checkout
    with:
      vale-paths: README.md CHANGELOG.md SECURITY.md docs report .github
      # This repository and its portfolio siblings are linked before they are public; other links are still checked.
      lychee-args: >-
        --no-progress --max-retries 3 --accept 200..=299,403,429
        --exclude '^https://github\.com/gamaware/(aws-devops-portfolio|aws-genai-architecture-review-sample|\.github)' './**/*.md'

  lint-actions:
    name: lint-actions
    uses: gamaware/.github/.github/workflows/lint-actions.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9 # gamaware/.github initial workflows
    permissions:
      contents: read # checkout

  secrets:
    name: secrets
    uses: gamaware/.github/.github/workflows/secrets.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9 # gamaware/.github initial workflows
    permissions:
      contents: read # checkout

  security:
    name: security
    uses: gamaware/.github/.github/workflows/security.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9 # gamaware/.github initial workflows
    permissions:
      contents: read # checkout

  report:
    name: report
    uses: gamaware/.github/.github/workflows/report.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9 # gamaware/.github initial workflows
    permissions:
      contents: read # checkout
    with:
      evidence-command: python -m pip install --disable-pip-version-check "uv==0.12.19" && make evidence

  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.61.0

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Run make verify
        run: make verify
